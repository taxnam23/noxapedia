<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none">
  <!-- Background Pill/Banner -->
  <rect x="1" y="1" width="358" height="70" rx="16" fill="#070B14" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left Icon Group (Translated to center vertically) -->
  <g transform="translate(8, 4)">
    <!-- Outer Molecular Hexagon Ring -->
    <path
      d="M32 9L52 20.5V43.5L32 55L12 43.5V20.5L32 9Z"
      stroke="#06B6D4"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-opacity="0.9"
    />
    <!-- Inner Molecular Double-Bond Accents -->
    <path
      d="M32 14.5L47 23.2"
      stroke="#22D3EE"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-opacity="0.45"
    />
    <path
      d="M17 40.8L32 49.5"
      stroke="#F43F5E"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-opacity="0.45"
    />
    <!-- Central Geometric "N" + Synaptic / ECG Telemetry Trace -->
    <path
      d="M22 42V22L30 33L34 29L42 42V22"
      stroke="#F8FAFC"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Synaptic & Receptor Nodes -->
    <circle cx="22" cy="22" r="3.5" fill="#22D3EE" />
    <circle cx="22" cy="42" r="2.5" fill="#94A3B8" />
    <circle cx="42" cy="22" r="2.5" fill="#94A3B8" />
    <circle cx="42" cy="42" r="3.5" fill="#F43F5E" />
  </g>

  <!-- Divider Line -->
  <line x1="76" y1="16" x2="76" y2="56" stroke="#1E293B" stroke-width="1.5" />

  <!-- Wordmark: NOXA (Cyan/White) + PEDIA (Slate) -->
  <text
    x="92"
    y="37"
    fill="#F8FAFC"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="2.5"
  >
    NOXA<tspan fill="#22D3EE">PEDIA</tspan>
  </text>

  <!-- Subtitle -->
  <text
    x="93"
    y="54"
    fill="#94A3B8"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="10.5"
    font-weight="500"
    letter-spacing="1.2"
  >
    NEUROBIOLOGY &amp; TOXICOLOGY ATLAS
  </text>
</svg>

